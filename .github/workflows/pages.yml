# Publica el manual de armado en GitHub Pages: https://zomvr2.github.io/noidea/
# Solo se sube docs/manual-armado.html (la página es pública).
name: Manual de armado (Pages)

on:
  push:
    branches: [master]
    paths: [docs/manual-armado.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Dos jobs: si se sube y despliega en el mismo job, deploy-pages a veces no encuentra el artefacto todavía.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: mkdir site && cp docs/manual-armado.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
